name: CI

on:
  push:
    branches: [main]
  pull_request:

# No deploy job: prod lives on a home server GitHub can't reach; `make deploy` by hand.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      # browser project mounts components in real chromium
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

